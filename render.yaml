services:
  - type: web
    name: ai-studymate
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-studymate-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: NODE_ENV
        value: production

databases:
  - name: ai-studymate-db
    plan: free
